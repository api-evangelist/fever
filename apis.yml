    0.00          |

    | `surcharge`            | Metric representing the sum of additional booking fees applied to the order
    at checkout. It's the sum of `ticket_surcharge` and `addon_surcharge`. It represents extra charges
    collected.                                                                                                                                                                                           |
    56.34         |

    | `discount`             | Metric representing the total value of all discounts applied through promo
    codes or special offers. It's the sum of all discounts applied, and it's represented with a negative
    value. It indicates the amount of revenue that has been reduced due to promotional efforts.                                                                                                         |
    -100.00       |

    | `user_payment`         | Metric representing the total revenue collected after discounts. It is
    computed as the `total_gross_revenue` + `discounts`. It reflects actual revenue paid by customers.                                                                                                                                                                                                           |
    1456.34       |


