- aid: fever:fever-authentication-api
  name: Fever Authentication API
  description: >-
    This endpoint is used to authenticate a user. It requires a username and password to be passed in
    the request body. If

    the user is authenticated successfully, a token is returned in the response body. This token is used
    to authenticate the

    user in subsequent requests.


    ⚠️ The token expiration time is **30 minutes**. After that time, the user will need to authenticate
    again to get a new token.
