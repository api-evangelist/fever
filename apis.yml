- aid: fever:fever-sessions-api
  name: Fever Sessions API
  description: >-
    The goal of the Session Endpoint is to provide all information about the session (or ticket types)
    of a plan.

    The delay of the data is less than 10 minutes from reality.


    ## Request filters


    `POST /v1/sessions/search` accepts the following optional request body fields. Filters compose with
    the existing `plan_ids` / `session_ids` OR-union behaviour: the warehouse update window is applied
    as an extra `AND` constraint on top of that union.


    | Field                    | Type                     | Required | Description                                                                                                                                                                                                          |

    |--------------------------|--------------------------|----------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|

    | `plan_ids`               | `list[int]`              | no       | Restrict sessions to the given
    plans. Unchanged.                                                                                                                                                                     |

    | `session_ids`            | `list[int]`              | no       | Restrict to the given sessions.
    Unchanged.                                                                                                                                                                           |

    | `updated_date_utc_from`  | `string` (UTC datetime)  | no       | **Inclusive** lower bound on the
    session warehouse row's last-updated timestamp (`DT_LAST_UPDATED`). Format `YYYY-MM-DD HH:MM`; if
    only the date is sent, `00:00` is appended. Must be sent together with `updated_date_utc_to`. |

    | `updated_date_utc_to`    | `string` (UTC datetime)  | no       | **Exclusive** upper bound on `DT_LAST_UPDATED`.
    Same format and pairing rules as `updated_date_utc_from`.                                                                                                            |


    The applied predicate is the half-open interval `DT_LAST_UPDATED >= updated_date_utc_from AND DT_LAST_UPDATED
    < updated_date_utc_to`, consistent with the cart-creation window on `/v1/carts`.


    ### Validation errors (`422 Unprocessable Entity`)


    - Only one of `updated_date_utc_from` / `updated_date_utc_to` is provided.

    - `updated_date_utc_from >= updated_date_utc_to`.

    - Either bound is not a valid `YYYY-MM-DD HH:MM` (or `YYYY-MM-DD`) string.


    ### Example request


    ```json

    POST /v1/sessions/search

    {
      "plan_ids": [12345],
      "session_ids": [],
      "updated_date_utc_from": "2026-05-24 00:00",
      "updated_date_utc_to": "2026-05-25 00:00"
    }

    ```


    The response shape is unchanged — these filters only narrow which sessions are returned.


    ## Model documentation


    <details>

    <summary><b>📄 <code>/sessions</code> response entity model</b></summary>


    | Column Name                     | Description                                                                                                                                                |
    Example value             |

    |---------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------|

    | `id`                            | ID of the session                                                                                                                                          |
    12345                     |

    | `name`                          | Name of the session, providing a short description of the product
    the client purchased.                                                                    | Adult Ticket              |

    | `available_tickets`             | Current number of available tickets for sale in the session.                                                                                               |
    103                       |

    | `capacity`                      | Current maximum number of tickets that can afford the session
    (sold + available).                                                                          | 400                       |

    | `end_date_utc`                  | UTC end date of the session.                                                                                                                               |
    2025-03-21 22:59:00.000 Z |

    | `first_purchasable_date_utc`    | UTC date of the first purchasable date of the session.                                                                                                     |
    2025-03-21                |

    | `is_addon`                      | Indicates whether the session is an addon.                                                                                                                 |
    FALSE                     |

    | `is_wait_list`                  | ⚠️ (_deprecated_) Indicates whether the session is actually a
    waitlist. This field is deprecated, it is now configured at plan level, not at session level | FALSE                     |

    | `plan_id`                       | ID of the plan associated with the session.                                                                                                                |
    12345                     |

    | `start_date_utc`                | UTC Start date of the session.                                                                                                                             |
    2025-03-21 22:59:00.000 Z |

    | `venue.city`                    | City of the venue where the session takes place.                                                                                                           |
    Madrid                    |

    | `venue.country`                 | Country of the venue where the session takes place in ISO3.                                                                                                |
    Spain                     |

    | `venue.name`                    | Name of the venue where the session takes place.                                                                                                           |
    Retiro                    |

    | `venue.timezone`                | Timezone of the venue where the session takes place.                                                                                                       |
    Europe/Madrid             |

    | `ticket_price`                  | Price of the ticket in the session.                                                                                                                        |
    10                        |

    | `ticket_price_tax_base`         | Base price of the ticket in the session.                                                                                                                   |
    8                         |

    | `surcharge_per_ticket`          | Surcharge applied to the ticket in the session.                                                                                                            |
    1                         |

    | `surcharge_per_ticket_tax_base` | Base price of the surcharge per ticket                                                                                                                     |
    1                         |

    | `session_type_id`               | Fever session-type identifier. Join key for `/reports/entitlements`.                                                                                       |
    88123                     |

    | `product_type`                  | Product type of the session (e.g. `TIMED_ENTRY`). Nullable — returns
    `null` when the session has no associated session type.                              | TIMED_ENTRY               |

    | `customer_profile`              | Target customer profile of the session (e.g. `ADULT`, `CHILD`).
    Nullable — returns `null` when the session has no associated session type.                | ADULT                     |

    | `group_name`                    | Name of the session type group. Nullable — returns `null` when
    the session type has no associated group.                                                  | General
    Admission         |


    </details>
