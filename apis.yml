aid: fever
name: Fever
description: >-
  Fever is a global live-entertainment discovery and ticketing platform that
  helps millions of people find events, activities and experiences in their
  city, and gives venues and partners the tools to sell and analyze tickets.
  For developers Fever exposes two public surfaces: an official Model Context
  Protocol (MCP) server over its real-time global event catalog (tools
  search_cities and search_events, OAuth 2.0 with PKCE), and a partner-facing
  Reporting API delivering in-depth event sales data (orders, tickets,
  financials, plan and session details) for CRM, BI, data-warehouse and ERP
  integration. Fever is backed by Accel and General Catalyst.
