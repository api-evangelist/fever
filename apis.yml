- aid: fever:fever-order-items-api
  name: Fever Order Items API
  description: >-
    These endpoints enable to access order-item data.


    ## Filtering Options


    The endpoint supports filtering by:


    | Parameter | Type | Description |

    |-----------|------|-------------|

    | `order_ids` | array[integer] | List of specific order IDs |

    | `plan_ids` | array[integer] | List of specific plan (event) IDs |

    | `date_field` | string | Date field to filter on (`CREATED_DATE_UTC`, `UPDATED_DATE_UTC`, or `EVENT_START_DATE_UTC`).
    `UPDATED_DATE_UTC` filters on when the order **data** last changed (any field of the flattened record,
    including nested/enrichment fields such as plan name), matching the `updated_date_utc` field in the
    response — not the order's own update time (`order_updated_date_utc`). |

    | `date_from` | string | Start date for the selected date field. Format: `YYYY-MM-DD HH:mm` or `YYYY-MM-DD`
    |

    | `date_to` | string | End date for the selected date field. Format: `YYYY-MM-DD HH:mm` or `YYYY-MM-DD`
    |


    ## Model documentation


    #### Orders with Order Items


    The goal of this endpoint is to provide a comprehensive picture about orders with detailed information
    about their

    associated order items, including buyers, owners, partners, plans, sessions, and more.


    <details>

    <summary><b>📄 <code>/reports/order-items</code> response entity model</b></summary>


    | Column Name                | Description                                                                   |
    Example value                                              |

    |----------------------------|-------------------------------------------------------------------------------|-------------------------------------------------------------|

    | `id`                       | Unique order ID. This code groups all tickets bought in the same transaction.
    | 12345                                                      |

    | `parent_order_id`          | If the order comes from a reschedule, the original order ID                   |
    11234                                                      |

    | `buyer`                    | Order buyer information.                                                      |
    _See `order.buyer` documentation below_                    |

    | `created_date_utc`         | UTC date when the order was created.                                          |
    2021-01-01T00:00:00Z                                       |

    | `updated_date_utc`         | UTC date when the order **data** was last updated — moves whenever
    any field of the flattened order record changes (including nested/enrichment fields such as plan name,
    UTM or ratings). This is the field the `UPDATED_DATE_UTC` filter matches, so filtering by `UPDATED_DATE_UTC`
    and this value are always consistent. | 2021-01-01T00:00:00Z |

    | `order_updated_date_utc`   | UTC date when the order **itself** was last updated (order-level fields
    only). Unlike `updated_date_utc`, it does not move when only nested/enrichment data changes. | 2021-01-01T00:00:00Z
    |

    | `surcharge`                | Surcharge applied to the order.                                               |
    0.0                                                        |

    | `currency`                 | ISO3 currency of the order monetary fields.                                   |
    USD                                                        |

    | `purchase_channel`         | Purchase channel where the transaction comes from.                            |
    web                                                        |

    | `channel`                  | Channel slug through which this order was placed. Use this field to
    join with `POST /v1/reports/channels/search` — the `channel` field in both endpoints is the same slug.
    `null` when no channel is recorded on the order (e.g. box-office or pre-channel data). | partner-channel
    |

    | `payment_method`           | Payment method used.                                                          |
    credit_card                                                |

    | `purchase_location_source` | Purchase location information.                                                |
    _See `order.purchase_location_source` documentation below_ |

    | `billing_zip_code`         | Billing ZIP Code manually fulfilled by the customer.                          |
    28001                                                      |

    | `utm`                      | UTM information attributed to the order.                                      |
    _See `order.utm` documentation below_                      |

    | `partner`                  | Partner information.                                                          |
    _See `order.partner` documentation below_                  |

    | `business`                 | Business associated with the order.                                           |
    _See `order.business` documentation below_                 |

    | `plan`                     | Plan information.                                                             |
    _See `order.plan` documentation below_                     |

    | `coupon`                   | Coupon information.                                                           |
    _See `order.coupon` documentation below_                   |

    | `assigned_seats`           | List of assigned seats for the order.                                         |
    _See `order.assigned_seats` documentation below_           |

    | `order_items`              | List of order items associated with this order.                               |
    _See `order.order_items` documentation below_              |

    | `booking_questions`        | List of booking questions and answers for the order.                          |
    _See `order.booking_questions` documentation below_        |

    | `order_group_id`           | 🚧 **Under Development.** Groups orders from cluster tickets. All orders
    with the same `order_group_id` belong to the same purchase group (e.g., bundled tickets across multiple
    venues). | 12345                                                      |

    | `is_main_group_order`      | 🚧 **Under Development.** Flag indicating whether this is the main order
    in a group. `true` for the primary order, `false` for secondary orders in the same group.                       |
    true                                                       |

    | `staff_notes`              | List of staff notes attached to the order. Opt-in: only returned when
    the search request includes `included_fields=staff_notes`; otherwise the field is omitted from the
    response. | `["Payment Details: Groupon", "change ticket to new day"]` |

    | `booked_slots`             | List of booked slots (assets/rooms reserved by the cart).                     |
    _See `order.booked_slots` documentation below_             |

    | `payment_details`          | Card payment details for the order (transaction id, brand and descriptive
    payment method). Empty/null when the order was not paid by card or no card details are recorded. |
    _See `order.payment_details` documentation below_ |


