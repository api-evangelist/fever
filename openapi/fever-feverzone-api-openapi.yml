    SalesByTicketTypeParams:
      properties:
        currency:
          anyOf:
          - $ref: '#/components/schemas/Currency'
          - type: 'null'
          description: Currency code to convert the sales data. If not provided, the data will be returned in the currency of the venue. However, it is mandatory if there are several currencies in the plans.
          example: USD
        plan_ids:
          anyOf:
          - items:
              type: integer
            type: array
            maxItems: 1000
          - type: 'null'
          title: Plan Ids
          description: List of ids of the plans to filter by.
          default: []
          examples:
          - []
          - - 123
          - - 123
            - 456
        event_start_date_local_from:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Start Date Local From
          description: Local start date for the event start date filter. The timezone corresponds to the venue timezone where the event takes place. If hour and minute are not specified, 00:00 is added by default
          example: 2024-12-01 00:00
        event_start_date_local_to:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Start Date Local To
          description: Local end date for the event start date filter. The timezone corresponds to the venue timezone where the event takes place. If hour and minute are not specified, 00:00 is added by default
          example: 2024-12-31 00:00
        purchase_date_local_from:
