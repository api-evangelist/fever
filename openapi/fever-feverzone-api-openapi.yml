tags:
- name: FeverZone
  description: 'These endpoints provide an interface to extract the data available in FeverZone reports. The delay of the data

    is less than 15 minutes from reality. The route `/feverzone/sales-by-reseller` allows the user to get a sales summary

    by reseller and can be aggregated by venues/ticket types.


    ## Model documentation


    #### Sales


    This endpoint returns a summary of the sales, aligned with FeverZone Sales Summary report. It allows to filter by

    `plan_ids`, `purchase_date` and `event_date`, and also specify the `currency` of the report.


    <details>

    <summary><b>📄 <code>/feverzone/sales-summary</code> response entity model</b></summary>


    | Column Name            | Description                                                                                                                                                                                                                                                                                                                                                                         | Example value |

    |------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------|

    | `currency`             | ISO3 currency of the order monetary field.                                                                                                                                                                                                                                                                                                                                          | EUR           |

    | `orders`               | Metric representing the number of unique transactions (count) made, where each order may include multiple tickets and add-ons.                                                                                                                                                                                                                                                      | 100           |

    | `tickets_sold`         | Metric representing the number (sum) of entry tickets sold, excluding any complimentary tickets issued (invitations) and add-ons. This value shows the total number of entry tickets, representing the primary sales volume.                                                                                                                                                        | 200           |

    | `addons_sold`          | Metric representing the number (sum) of add-ons sold, excluding complimentary invitations. Indicates the total number of add-ons purchased.                                                                                                                                                                                                                                         | 50            |

    | `ticket_invitations`   | Metric representing the number (sum) of complimentary tickets issued at no charge for the user. Issuing invitations may have fees.                                                                                                                                                                                                                                                  | 10            |

    | `addons_invitations`   | Metric representing the number (sum) of complimentary add-ons issued at no charge. Issuing add-ons may have fees.                                                                                                                                                                                                                                                                   | 5             |

    | `ticket_gross_revenue` | Metric representing the revenue generated exclusively from the sale of entry tickets. It''s the sum of `tickets_sold` multiplied by their ticket price. It shows the financial contribution of ticket sales to the total revenue.                                                                                                                                                    | 1200.00       |

    | `addon_gross_revenue`  | Metric representing the revenue generated from the sale of additional items or services, such as merchandise or premium experiences (a.k.a. add-ons). It''s the sum of `addons_sold` multiplied by their add-on price. It indicates the contribution of supplementary products or services to total revenue.                                                                         | 356.34        |

    | `total_gross_revenue`  | Metric representing the total amount of revenue generated from ticket sales and add-ons, including surcharge, and before any discounts are applied. It equals to `ticket_gross_revenue` + `addon_gross_revenue` + `surcharge`. Indicates the overall financial performance, showing the total revenue collected from sales and additional charges before considering any discounts. | 1556.34       |

    | `ticket_surcharge`     | Metric representing the surcharges applied specifically to entry ticket sales. It''s the sum of `tickets_sold` multiplied by their surcharge per ticket. It provides details on the extra fees associated with entry ticket purchases.                                                                                                                                               | 56.34         |

    | `addon_surcharge`      | Metric representing the surcharges applied specifically to add-ons. It''s the sum of `addons_sold` multiplied by their surcharge per add-on. It shows the extra fees collected from add-on purchases.                                                                                                                                                                                | 0.00          |

    | `surcharge`            | Metric representing the sum of additional booking fees applied to the order at checkout. It''s the sum of `ticket_surcharge` and `addon_surcharge`. It represents extra charges collected.                                                                                                                                                                                           | 56.34         |

    | `discount`             | Metric representing the total value of all discounts applied through promo codes or special offers. It''s the sum of all discounts applied, and it''s represented with a negative value. It indicates the amount of revenue that has been reduced due to promotional efforts.                                                                                                         | -100.00       |

    | `user_payment`         | Metric representing the total revenue collected after discounts. It is computed as the `total_gross_revenue` + `discounts`. It reflects actual revenue paid by customers.                                                                                                                                                                                                           | 1456.34       |


    </details>


    <details>

    <summary><b>📄 <code>/feverzone/sales-by-ticket-type</code> response entity model</b></summary>


    | Column Name            | Description                                                                                                                                                                                                                                                                                                                                                                         | Example value |

    |------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------|

    | `currency`             | ISO3 currency of the order monetary field.                                                                                                                                                                                                                                                                                                                                          | EUR           |

    | `ticket_type`          | Type of ticket sold.                                                                                                                                                                                                                                                                                                                                                                | Adult         |

    | `tickets_sold`         | Metric representing the number (sum) of entry tickets sold, excluding any complimentary tickets issued (invitations) and add-ons. This value shows the total number of entry tickets, representing the primary sales volume.                                                                                                                                                        | 200           |

    | `addons_sold`          | Metric representing the number (sum) of add-ons sold, excluding complimentary invitations. Indicates the total number of add-ons purchased.                                                                                                                                                                                                                                         | 50            |

    | `ticket_invitations`   | Metric representing the number (sum) of complimentary tickets issued at no charge for the user. Issuing invitations may have fees.                                                                                                                                                                                                                                                  | 10            |

    | `addons_invitations`   | Metric representing the number (sum) of complimentary add-ons issued at no charge. Issuing add-ons may have fees.                                                                                                                                                                                                                                                                   | 5             |

    | `ticket_gross_revenue` | Metric representing the revenue generated exclusively from the sale of entry tickets. It''s the sum of `tickets_sold` multiplied by their ticket price. It shows the financial contribution of ticket sales to the total revenue.                                                                                                                                                    | 1200.00       |

    | `addon_gross_revenue`  | Metric representing the revenue generated from the sale of additional items or services, such as merchandise or premium experiences (a.k.a. add-ons). It''s the sum of `addons_sold` multiplied by their add-on price. It indicates the contribution of supplementary products or services to total revenue.                                                                         | 356.34        |

    | `total_gross_revenue`  | Metric representing the total amount of revenue generated from ticket sales and add-ons, including surcharge, and before any discounts are applied. It equals to `ticket_gross_revenue` + `addon_gross_revenue` + `surcharge`. Indicates the overall financial performance, showing the total revenue collected from sales and additional charges before considering any discounts. | 1556.34       |

    | `ticket_surcharge`     | Metric representing the surcharges applied specifically to entry ticket sales. It''s the sum of `tickets_sold` multiplied by their surcharge per ticket. It provides details on the extra fees associated with entry ticket purchases.                                                                                                                                               | 56.34         |

    | `addon_surcharge`      | Metric representing the surcharges applied specifically to add-ons. It''s the sum of `addons_sold` multiplied by their surcharge per add-on. It shows the extra fees collected from add-on purchases.                                                                                                                                                                                | 0.00          |

    | `surcharge`            | Metric representing the sum of additional booking fees applied to the order at checkout. It''s the sum of `ticket_surcharge` and `addon_surcharge`. It represents extra charges collected.                                                                                                                                                                                           | 56.34         |

    | `discount`             | Metric representing the total value of all discounts applied through promo codes or special offers. It''s the sum of all discounts applied, and it''s represented with a negative value. It indicates the amount of revenue that has been reduced due to promotional efforts.                                                                                                         | -100.00       |

    | `user_payment`         | Metric representing the total revenue collected after discounts. It is computed as the `total_gross_revenue` + `discounts`. It reflects actual revenue paid by customers.                                                                                                                                                                                                           | 1456.34       |


    </details>


    <details>

    <summary><b>📄 <code>/feverzone/sales-by-reseller</code> response entity model</b></summary>


    | Column Name                    | Description                                                    | Example value                        |

    |--------------------------------|----------------------------------------------------------------|--------------------------------------|

    | `reseller.id`                  | ID of the reseller                                             | 607f50e3-666f-4b2e-9620-38aabf6d9m10 |

    | `reseller.name`                | Name of the reseller                                           | Reseller name                        |

    | `reseller.email`               | Email of the reseller                                          | test@reseller.com                    |

    | `reseller.type`                | Type of reseller                                               | AGENCY                               |

    | `reseller.contact_language`    | Language that the reseller uses for communications             | es_ES                                |

    | `reseller.accepts_comms`       | If reseller accepts communications or not                      | YES                                  |

    | `ticket_type`                  | Ticket type by reseller                                        | Agencia \| Tarifa Básica             |

    | `venue_name`                   | Venue name by reseller                                         | Palacio Real de Madrid               |

    | `tickets_sold`                 | Tickets sold by reseller and aggregated dimensions applicable  | 1000                                 |

    | `gross_revenue`                | Gross revenue by reseller and aggregated dimensions applicable | 10000                                |


    </details>

    '
paths:
  /feverzone/sales-summary/search:
    post:
      tags:
      - FeverZone
      summary: Request FeverZone sales summary report
      description: Create a request to get a new FeverZone sales summary report within the given time range.The field plan_ids can be used to include only certain plans in the report.If empty, the sales summary report will refer to all plans.The search will be processed asynchronously, being able to fetch the result from the provided search ID
      operationId: search_sales_summary_feverzone_sales_summary_search_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user-id-to-impersonate
        in: header
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: User id from the user that you want to impersonate
          title: User-Id-To-Impersonate
        description: User id from the user that you want to impersonate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesSummaryParams'
      responses:
        '202':
          description: Request was created successfully but is still running asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchStatus'
        '408':
          description: Request Timeout
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      default: The request timed out. Please try again later
                      example: The request timed out. Please try again later
                      title: Detail
                      type: string
                  title: RequestTimeoutError
                  type: object
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      default: Server is busy. Please retry your query later
                      example: Server is busy. Please retry your query later
                      title: Detail
                      type: string
                  title: ServerBusyError
                  type: object
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      default: An internal server error occurred. Please try again later
                      example: An internal server error occurred. Please try again later
                      title: Detail
                      type: string
                  title: InternalServerError
                  type: object
        '422':
          description: Validation Error
          content:
