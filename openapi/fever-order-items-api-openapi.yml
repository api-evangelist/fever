          description: Surcharge applied to the ticket
          example: 2.0
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
          description: 'If the ticket is active, transferred, or cancelled. ACTIVE: means that the ticket ID can be redeemed or it is redeemed. CANCELLED: means that the ticket ID can''t be redeemed since it has been cancelled. TRANSFERRED: means that the ticket ID can''t be used since it has been fully transferred to another user'
