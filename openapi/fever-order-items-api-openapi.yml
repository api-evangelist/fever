    </details>


    </details>


    <details>

    <summary><span style="font-size:18pt;"><code>order.payment_details</code></span></summary>


    Order-level array of card payment details. Empty/null when the order was not paid by card. The same array is denormalized across every order item belonging to the same order.


    | Column Name      | Description                                                               | Example value |

    |------------------|---------------------------------------------------------------------------|---------------|

    | `id`             | Transaction ID issued by the payment processor (Braintree, Stripe, ...).  | tx_abc123     |

    | `card_brand`     | Card brand (`visa`, `mastercard`, `amex`, `discover`, ...).               | visa          |

    | `payment_method` | Descriptive payment method joined from the order''s payment configuration. | Card          |


    </details>


    <details>

    <summary><span style="font-size:18pt;"><code>order.order_items</code></span></summary>


    | Column Name                       | Description                                                                                                                                                                                                                                                                                                                                                                                          | Example value                                     |

    |-----------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------|

    | `id`                              | Unique ID of the order item.                                                                                                                                                                                                                                                                                                                                                                         | 123456                                            |

    | `ticket_id`                       | Operational identifier of the ticket grouping order items from the same session. Provided for compatibility with transactional use cases (e.g., reschedules and transfers); it is not intended as a core reporting metric.                                                                                                                                                                           | 334455                                            |

    | `booked_slot_id`                  | ID of the booked slot the order item was assigned to within its cart, when the activity behind the session uniquely resolves to a single booked slot (e.g. Escape This rooms). Matches `order.booked_slots[].id`. NULL when the activity exposes more than one asset and the cart engine spread parties across them; consumers can fall back to substring matching against `booked_slots[].asset.name`. | 9876543                                           |

    | `cancellation_date_utc`           | Last UTC date when any part of the ticket was cancelled.                                                                                                                                                                                                                                                                                                                                             | 2021-01-01T00:00:00Z                              |

    | `cancellation_type`               | Type of cancellation. REFUND: means that the ticket has been cancelled due to a refund. RESCHEDULE: means that the ticket has been cancelled due to a reschedule.                                                                                                                                                                                                                                    | REFUND                                            |

    | `created_date_utc`                | UTC date of the ticket creation.                                                                                                                                                                                                                                                                                                                                                                     | 2021-01-01T00:00:00Z                              |

    | `discount`                        | Discount applied to the ticket.                                                                                                                                                                                                                                                                                                                                                                      | 10.0                                              |

    | `is_invite`                       | Indicates whether the ticket is an invitation from the partner.                                                                                                                                                                                                                                                                                                                                      | false                                             |

    | `modified_date_utc`               | UTC date of the last modification of the ticket.                                                                                                                                                                                                                                                                                                                                                     | 2021-01-01T00:00:00Z                              |

    | `purchase_date_utc`               | UTC date of the ticket purchase.                                                                                                                                                                                                                                                                                                                                                                     | 2021-01-01T00:00:00Z                              |

    | `event_start_date_utc`            | UTC start date of the event associated with this order item.                                                                                                                                                                                                                                                                                                                                         | 2021-01-01T00:00:00Z                              |

    | `validated_date_utc`              | UTC date when the order item was validated. This validation can be independent of the plan code (bar code), since some order items don''t have a plan code but can be validated.                                                                                                                                                                                                                      | 2021-01-01T00:00:00Z                              |

    | `rating_comment`                  | Comment from the ticket user after attending the event.                                                                                                                                                                                                                                                                                                                                              | Great experience!                                 |

    | `rating_value`                    | Rating given by the ticket user after attending the event, ranging from 1 to 5.                                                                                                                                                                                                                                                                                                                      | 5.0                                               |

    | `surcharge`                       | Surcharge applied to the ticket.                                                                                                                                                                                                                                                                                                                                                                     | 2.0                                               |

    | `status`                          | If the ticket is active, transferred, or cancelled. ACTIVE: means that the ticket ID can be redeemed or it is redeemed. CANCELLED: means that the ticket ID can''t be redeemed since it has been cancelled. TRANSFERRED: means that the ticket ID can''t be used since it has been fully transferred to another user.                                                                                  | ACTIVE                                            |

    | `unitary_price`                   | Unitary price of the purchased ticket.                                                                                                                                                                                                                                                                                                                                                               | 50.0                                              |

    | `metadata`                        | Partner-supplied identifiers for reconciliation against the partner''s own system of record. **Opt-in via `included_fields=metadata`.** NULL when the partner did not provide any reporting metadata for the order item.                                                                                                                                                                              | _See `order_item.metadata` documentation below_   |

    | `owner`                           | Order item owner information.                                                                                                                                                                                                                                                                                                                                                                        | _See `order_item.owner` documentation below_      |

    | `plan_codes`                      | Plan code associated with the order item.                                                                                                                                                                                                                                                                                                                                                            | _See `order_item.plan_codes` documentation below_ |

    | `session`                         | Session information.                                                                                                                                                                                                                                                                                                                                                                                 | _See `order_item.session` documentation below_    |

    | `pack`                            | Pack information if the order item belongs to a pack. `null` when the order item does not belong to a pack.                                                                                                                                                                                                                                                                                          | _See `order_item.pack` documentation below_       |


    <details>

    <summary><span style="font-size:16pt;"><code>order_item.metadata</code></span></summary>


    Partner-supplied identifiers attached at the time of purchase, intended to help partners reconcile Fever order items against rows in their own system of record (box-office ticket IDs, internal SKUs, subproduct variants, etc.). Only present when the request opts in via `included_fields=metadata`; NULL when the partner did not provide any reporting metadata for the order item.


    | Column Name              | Description                                                                                                                                                                                                     | Example value |

    |--------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------|

    | `external_id`            | Partner-supplied external identifier for the order item, as sent by the partner''s integration when the order was placed.                                                                                        | CJ51001B      |

    | `external_subproduct_id` | Partner-supplied external subproduct identifier for the order item, used when a single plan exposes multiple distinguishable subproducts (e.g., adult vs. child ticket variants, add-ons, seating categories).  | ADULTO        |


    </details>


    <details>

    <summary><span style="font-size:16pt;"><code>order_item.owner</code></span></summary>


    | Column Name            | Description                                                                                                     | Example value    |

    |------------------------|-----------------------------------------------------------------------------------------------------------------|------------------|

    | `id`                   | Unique ID of the person who owns the ticket.                                                                    | 123456           |

    | `first_name`           | First name of the owner of the ticket.                                                                          | John             |

    | `last_name`            | Last name of the owner of the ticket.                                                                           | Doe              |

    | `email`                | Email of the owner of the ticket.                                                                               | test@example.com |

    | `date_of_birthday`     | Date of birth of the owner of the ticket.                                                                       | 1990-01-01       |

    | `marketing_preference` | Indicates whether the user accepted receiving marketing communications from the partner in the checkout screen. | true             |

    | `language`             | Language of the owner of the ticket, extracted from the device locale. The format is ISO 639-1 (two letters).   | en               |


    </details>


    <details>

    <summary><span style="font-size:16pt;"><code>order_item.plan_codes</code></span></summary>


    | Column Name         | Description                                                                                        | Example value        |

    |---------------------|----------------------------------------------------------------------------------------------------|----------------------|

    | `id`                | Unique ID of the plan code. A plan code is the unique code needed for redemption to join an event. | 111                  |

    | `cd_barcode`        | Barcode code associated to the plan code.                                                          | A1B2C3               |

    | `created_date_utc`  | UTC date of the creation of the plan code.                                                         | 2021-01-01T00:00:00Z |

    | `modified_date_utc` | UTC date of the last modification of the plan code.                                                | 2021-01-01T00:00:00Z |

    | `redeemed_date_utc` | UTC date when the plan code was redeemed.                                                          | 2021-01-01T00:00:00Z |

    | `is_cancelled`      | Whether the plan code is cancelled or not.                                                         | false                |

    | `is_validated`      | Whether the plan code has been validated or not.                                                   | true                 |


    </details>


    <details>

    <summary><span style="font-size:16pt;"><code>order_item.session</code></span></summary>


    | Column Name                  | Description                                                                                                                          | Example value                                        |

    |------------------------------|--------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------|

    | `id`                         | Unique ID of the session. A session represents a specific date and ticket type of a plan, and also the product the client purchased. | 123456                                               |

    | `name`                       | Name of the session, providing a short description of the product the client purchased.                                              | Session Name                                         |

    | `end_date_utc`               | UTC end date of the session.                                                                                                         | 2021-01-01T00:00:00Z                                 |

    | `first_purchasable_date_utc` | UTC date of the first purchasable date of the session.                                                                               | 2021-01-01T00:00:00Z                                 |

    | `is_addon`                   | Indicates whether the session is an addon.                                                                                           | false                                                |

    | `is_wait_list`               | Indicates whether the session is actually a waitlist.                                                                                | false                                                |

    | `start_date_utc`             | UTC start date of the session.                                                                                                       | 2021-01-01T00:00:00Z                                 |

    | `venue`                      | Venue information.                                                                                                                   | _See `order_item.session.venue` documentation below_ |


    <details>

    <summary><span style="font-size:14pt;"><code>order_item.session.venue</code></span></summary>


    | Column Name | Description                                                 | Example value |

    |-------------|-------------------------------------------------------------|---------------|

    | `city`      | City of the venue where the session takes place.            | Madrid        |

    | `country`   | Country of the venue where the session takes place in ISO3. | Spain         |

    | `name`      | Name of the venue where the session takes place.            | Venue Name    |

    | `timezone`  | Timezone of the venue where the session takes place.        | Europe/Madrid |


    </details>


    </details>


    <details>

    <summary><span style="font-size:16pt;"><code>order_item.pack</code></span></summary>


    Pack information for order items that belong to a pack. `null` when the order item does not belong to a pack.


    | Column Name    | Description                                                                                                                                                                                                                     | Example value |

    |----------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------|

    | `id`           | Unique identifier of the pack unit. Groups all member order items belonging to the same purchased pack.                                                                                                                         | 11223         |

    | `session_id`   | Unique catalog session ID for the pack. Matches the `id` returned by `GET /v1/sessions`. Stable across all purchases of the same pack session. Use this instead of `session_name`, which is not unique. `null` when the item does not belong to a pack. | 284360344 |

    | `session_name` | Pack session label (display name of the pack). Not unique — multiple packs across different plans may share the same label.                                                                                                     | Family Pack   |


    </details>


    </details>


    </details>

    '
paths:
  /reports/order-items/search:
    post:
      tags:
      - Order Items
      summary: Request order items report
      description: Create a request to get a new order items report within the given time range.The search will be processed asynchronously, being able to fetch the result from the provided search ID
      operationId: search_order_items_reports_order_items_search_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user-id-to-impersonate
        in: header
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: User id from the user that you want to impersonate
          title: User-Id-To-Impersonate
        description: User id from the user that you want to impersonate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemParams'
      responses:
        '202':
          description: Request was created successfully but is still running asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchStatus'
        '408':
          description: Request Timeout
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      default: The request timed out. Please try again later
                      example: The request timed out. Please try again later
                      title: Detail
                      type: string
                  title: RequestTimeoutError
                  type: object
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      default: Server is busy. Please retry your query later
                      example: Server is busy. Please retry your query later
                      title: Detail
                      type: string
                  title: ServerBusyError
                  type: object
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      default: An internal server error occurred. Please try again later
                      example: An internal server error occurred. Please try again later
                      title: Detail
                      type: string
                  title: InternalServerError
                  type: object
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-codeSamples:
      - lang: bash
        source: "\ncurl -X POST \"https://<HOSTNAME>/v1/reports/order-items/search\" \\\n-H \"Content-Type: application/json\" \\\n-d '{\n    \"order_ids\": [\n        123,\n        456\n    ],\n    \"plan_ids\": [\n        123,\n        456\n    ],\n    \"date_field\": \"CREATED_DATE_UTC\",\n    \"date_from\": \"2024-12-18 00:00\",\n    \"date_to\": \"2024-12-19 00:00\"\n}' \\\n-H \"Authorization: Bearer <YOUR_ACCESS_TOKEN>\"\n            "
        label: curl
      - lang: python
        source: "\nimport requests\n\nhostname = \"<HOSTNAME>\"\nusername = \"<USERNAME>\"\npassword = \"<PASSWORD>\"\n\naccess_token = requests.post(f\"https://{hostname}/v1/auth/token\", data={\"username\": username, \"password\": password}).json()[\"access_token\"]\n\nrequests.post(f\"https://{hostname}/v1/reports/order-items/search\",\n    json={\n    \"order_ids\": [\n        123,\n        456\n    ],\n    \"plan_ids\": [\n        123,\n        456\n    ],\n    \"date_field\": \"CREATED_DATE_UTC\",\n    \"date_from\": \"2024-12-18 00:00\",\n    \"date_to\": \"2024-12-19 00:00\"\n},\n    headers={\"Authorization\": f\"Bearer {access_token}\"}\n)\n"
        label: Python
  /reports/order-items/search/{search_id}:
    get:
      tags:
      - Order Items
      summary: Get order items report
      description: Get an existing order items report from `search_id`, allowing to pass a specific `page` number. In case the search is still processing, it will return a `202` status code and you should retry it again until it is ready. Otherwise, it will return a `200` code and a sales report having list of order items. Notice that the `partition_info` metadata is only returned when `page=0`, being `null` for the rest of the pages
      operationId: get_order_items_search_page_reports_order_items_search__search_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: search_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Search Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Page
      - name: included_fields
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemIncludedField'
          description: Optional fields to include in the response
          title: Included Fields
        description: Optional fields to include in the response
      - name: user-id-to-impersonate
        in: header
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: User id from the user that you want to impersonate
          title: User-Id-To-Impersonate
        description: User id from the user that you want to impersonate
      responses:
        '200':
          description: Search was obtained successfully
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Search_Order_OrderItemParams_-Output'
                - $ref: '#/components/schemas/SearchStatus'
                title: Response Get Order Items Search Page Reports Order Items Search  Search Id  Get
                $ref: '#/components/schemas/Search_Order_OrderItemParams_-Input'
        '202':
          description: Request is still running asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchStatus'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      example: 'User test@example.com is not allowed to access the following fields: ''forbidden_field_1'', ''forbidden_field_2'''
                      title: Detail
                      type: string
                  required:
                  - detail
                  title: ForbiddenAccessToFieldError
                  type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      example: Search 01b571aa-0203-e36d-0000-0d3758abb35d not found.
                      title: Detail
                      type: string
                  required:
                  - detail
                  title: SearchIdNotFoundError
                  type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      example: Search ID 1234 is not valid
                      title: Detail
                      type: string
                  required:
                  - detail
                  title: InvalidSearchIdError
                  type: object
                - properties:
                    detail:
                      example: Invalid partition parameter. The partition must be long type parsable and between 0 and 1, but 2 is specified.
                      title: Detail
                      type: string
                  required:
                  - detail
                  title: InvalidPageIdError
                  type: object
                - properties:
                    detail:
                      example: Response is too large. Please apply filters to reduce its size.
                      title: Detail
                      type: string
                  required:
                  - detail
                  title: ResponseTooLargeError
                  type: object
        '408':
          description: Request Timeout
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      default: The request timed out. Please try again later
                      example: The request timed out. Please try again later
                      title: Detail
                      type: string
                  title: RequestTimeoutError
                  type: object
        '410':
          description: Search expired
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      default: Search expired. Please create a new one
                      example: Search expired. Please create a new one
                      title: Detail
                      type: string
                  title: SearchExpiredError
                  type: object
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      default: Server is busy. Please retry your query later
                      example: Server is busy. Please retry your query later
                      title: Detail
                      type: string
                  title: ServerBusyError
                  type: object
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      default: An internal server error occurred. Please try again later
                      example: An internal server error occurred. Please try again later
                      title: Detail
                      type: string
                  title: InternalServerError
                  type: object
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-codeSamples:
      - lang: bash
        source: '

          curl -X GET "https://<HOSTNAME>/v1/reports/order-items/search/<SEARCH_ID>?page=0" \

          -H "Authorization: Bearer <YOUR_ACCESS_TOKEN>"

          '
        label: curl
      - lang: python
        source: "\nimport requests\n\nhostname = \"<HOSTNAME>\"\nusername = \"<USERNAME>\"\npassword = \"<PASSWORD>\"\n\naccess_token = requests.post(f\"https://{hostname}/v1/auth/token\", data={\"username\": username, \"password\": password}).json()[\"access_token\"]\n\nrequests.get(f\"https://{hostname}/v1/reports/order-items/search/<SEARCH_ID>\",\n    params={'page': 0},\n    headers={\"Authorization\": f\"Bearer {access_token}\"}\n)\n"
        label: Python
