          example: false
        modified_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Modified Date Utc
          description: UTC date of the last modification of the ticket
          example: '2021-01-01 00:00:00'
        purchase_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Purchase Date Utc
          description: UTC date of the ticket purchase
          example: '2021-01-01 00:00:00'
        event_start_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Start Date Utc
          description: UTC start date of the event associated with this order item
          example: '2021-01-01 00:00:00'
        validated_date_utc:
          anyOf:
          - type: string
          - type: 'null'
