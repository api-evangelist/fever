tags:
- name: Order Items
  description: 'These endpoints enable to access order-item data.


    ## Filtering Options


    The endpoint supports filtering by:


    | Parameter | Type | Description |

    |-----------|------|-------------|

    | `order_ids` | array[integer] | List of specific order IDs |

    | `plan_ids` | array[integer] | List of specific plan (event) IDs |

    | `date_field` | string | Date field to filter on (`CREATED_DATE_UTC`, `UPDATED_DATE_UTC`, or `EVENT_START_DATE_UTC`). `UPDATED_DATE_UTC` filters on when the order **data** last changed (any field of the flattened record, including nested/enrichment fields such as plan name), matching the `updated_date_utc` field in the response — not the order''s own update time (`order_updated_date_utc`). |

    | `date_from` | string | Start date for the selected date field. Format: `YYYY-MM-DD HH:mm` or `YYYY-MM-DD` |

    | `date_to` | string | End date for the selected date field. Format: `YYYY-MM-DD HH:mm` or `YYYY-MM-DD` |


    ## Model documentation


    #### Orders with Order Items


    The goal of this endpoint is to provide a comprehensive picture about orders with detailed information about their

    associated order items, including buyers, owners, partners, plans, sessions, and more.


    <details>

    <summary><b>📄 <code>/reports/order-items</code> response entity model</b></summary>


    | Column Name                | Description                                                                   | Example value                                              |

    |----------------------------|-------------------------------------------------------------------------------|-------------------------------------------------------------|

    | `id`                       | Unique order ID. This code groups all tickets bought in the same transaction. | 12345                                                      |

    | `parent_order_id`          | If the order comes from a reschedule, the original order ID                   | 11234                                                      |

    | `buyer`                    | Order buyer information.                                                      | _See `order.buyer` documentation below_                    |

    | `created_date_utc`         | UTC date when the order was created.                                          | 2021-01-01T00:00:00Z                                       |

    | `updated_date_utc`         | UTC date when the order **data** was last updated — moves whenever any field of the flattened order record changes (including nested/enrichment fields such as plan name, UTM or ratings). This is the field the `UPDATED_DATE_UTC` filter matches, so filtering by `UPDATED_DATE_UTC` and this value are always consistent. | 2021-01-01T00:00:00Z |

    | `order_updated_date_utc`   | UTC date when the order **itself** was last updated (order-level fields only). Unlike `updated_date_utc`, it does not move when only nested/enrichment data changes. | 2021-01-01T00:00:00Z |

    | `surcharge`                | Surcharge applied to the order.                                               | 0.0                                                        |

    | `currency`                 | ISO3 currency of the order monetary fields.                                   | USD                                                        |

    | `purchase_channel`         | Purchase channel where the transaction comes from.                            | web                                                        |

    | `channel`                  | Channel slug through which this order was placed. Use this field to join with `POST /v1/reports/channels/search` — the `channel` field in both endpoints is the same slug. `null` when no channel is recorded on the order (e.g. box-office or pre-channel data). | partner-channel |

    | `payment_method`           | Payment method used.                                                          | credit_card                                                |

    | `purchase_location_source` | Purchase location information.                                                | _See `order.purchase_location_source` documentation below_ |

    | `billing_zip_code`         | Billing ZIP Code manually fulfilled by the customer.                          | 28001                                                      |

    | `utm`                      | UTM information attributed to the order.                                      | _See `order.utm` documentation below_                      |

    | `partner`                  | Partner information.                                                          | _See `order.partner` documentation below_                  |

    | `business`                 | Business associated with the order.                                           | _See `order.business` documentation below_                 |

    | `plan`                     | Plan information.                                                             | _See `order.plan` documentation below_                     |

    | `coupon`                   | Coupon information.                                                           | _See `order.coupon` documentation below_                   |

    | `assigned_seats`           | List of assigned seats for the order.                                         | _See `order.assigned_seats` documentation below_           |

    | `order_items`              | List of order items associated with this order.                               | _See `order.order_items` documentation below_              |

    | `booking_questions`        | List of booking questions and answers for the order.                          | _See `order.booking_questions` documentation below_        |

    | `order_group_id`           | 🚧 **Under Development.** Groups orders from cluster tickets. All orders with the same `order_group_id` belong to the same purchase group (e.g., bundled tickets across multiple venues). | 12345                                                      |

    | `is_main_group_order`      | 🚧 **Under Development.** Flag indicating whether this is the main order in a group. `true` for the primary order, `false` for secondary orders in the same group.                       | true                                                       |

    | `staff_notes`              | List of staff notes attached to the order. Opt-in: only returned when the search request includes `included_fields=staff_notes`; otherwise the field is omitted from the response. | `["Payment Details: Groupon", "change ticket to new day"]` |

    | `booked_slots`             | List of booked slots (assets/rooms reserved by the cart).                     | _See `order.booked_slots` documentation below_             |

    | `payment_details`          | Card payment details for the order (transaction id, brand and descriptive payment method). Empty/null when the order was not paid by card or no card details are recorded. | _See `order.payment_details` documentation below_ |


    <details>

    <summary><span style="font-size:18pt;"><code>order.buyer</code></span></summary>


    | Column Name            | Description                                                                                                     | Example value                                          |

    |------------------------|-----------------------------------------------------------------------------------------------------------------|--------------------------------------------------------|

    | `id`                   | Unique ID of the buyer.                                                                                         | 123456                                                 |

    | `first_name`           | First name of the order buyer.                                                                                  | John                                                   |

    | `last_name`            | Last name of the order buyer.                                                                                   | Doe                                                    |

    | `email`                | Email of the order buyer.                                                                                       | test@example.com                                       |

    | `date_of_birthday`     | Date of birth of the order buyer.                                                                               | 1990-01-01                                             |

    | `marketing_preference` | Indicates whether the user accepted receiving marketing communications from the partner in the checkout screen. | true                                                   |

    | `language`             | Language of the order buyer, extracted from the device locale. The format is ISO 639-1 (two letters).           | en                                                     |

    | `b2b_end_user`         | B2B end-user information. `null` when the buyer is not B2B or no B2B end user is linked to the order.           | _See `order.buyer.b2b_end_user` documentation below_   |


    <details>

    <summary><span style="font-size:16pt;"><code>order.buyer.b2b_end_user</code></span></summary>


    | Column Name  | Description                       | Example value     |

    |--------------|-----------------------------------|-------------------|

    | `id`         | Unique ID of the B2B end user.    | 789012            |

    | `email`      | Email of the B2B end user.        | test@feverup.com  |

    | `first_name` | First name of the B2B end user.   | John              |

    | `last_name`  | Last name of the B2B end user.    | Doe               |


    </details>


    </details>


    <details>

    <summary><span style="font-size:18pt;"><code>order.purchase_location_source</code></span></summary>


    | Column Name    | Description                                                                                                                                               | Example value |

    |----------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------|---------------|

    | `id_geo_name`  | Geo name ID from where the purchase was made. This field is inferred so it might not be accurate. More information at https://www.geonames.org/about.html | 123456        |

    | `city_name`    | City from where the purchase was made. This field is inferred so it might not be accurate.                                                                | Madrid        |

    | `country_code` | Country code from where the purchase was made. This field is inferred so it might not be accurate.                                                        | ES            |

    | `region_code`  | Region code from where the purchase was made. This field is inferred so it might not be accurate.                                                         | MD            |

    | `postal_code`  | Best estimate of user location at time of purchase, combining multiple sources of information.                                                            | 28001         |

    | `quality`      | Quality order.                                                                                                                                            | 1.0           |


    </details>


    <details>

    <summary><span style="font-size:18pt;"><code>order.utm</code></span></summary>


    | Column Name            | Description                                                                     | Example value |

    |------------------------|---------------------------------------------------------------------------------|---------------|

    | `utm.source`           | Value of the UTM source field where the order comes from based on last click.   | google        |

    | `utm.medium`           | Value of the UTM medium field where the order comes from based on last click.   | cpc           |

    | `utm.campaign`         | Value of the UTM campaign field where the order comes from based on last click. | campaign_1234 |

    | `utm.content`          | Value of the UTM content field where the order comes from based on last click.  | 692693771262  |

    | `utm.term`             | Value of the UTM term field where the order comes from based on last click.     | candlelight   |

    | `utm.referring_domain` | Value of the referring domain where the order comes from.                       | google.com    |


    </details>


    <details>

    <summary><span style="font-size:18pt;"><code>order.partner</code></span></summary>


    | Column Name | Description               | Example value |

    |-------------|---------------------------|---------------|

    | `id`        | Unique ID of the partner. | 1             |

    | `name`      | Name of the partner.      | Partner Name  |


    </details>


    <details>

    <summary><span style="font-size:18pt;"><code>order.business</code></span></summary>


    | Column Name | Description                                 | Example value                        |

    |-------------|---------------------------------------------|--------------------------------------|

    | `id`        | Unique ID of the business.                  | 7c1caabf-85cd-42ac-96db-524b15443a7b |

    | `name`      | Name of the business.                       | Sample City Tours                    |

    | `tax_id`    | Tax identification number of the business.  | B12345678                            |


    </details>


    <details>

    <summary><span style="font-size:18pt;"><code>order.plan</code></span></summary>


    | Column Name  | Description                                                                                                                                          | Example value                                       |

    |--------------|------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------|

    | `id`         | Unique ID of the plan.                                                                                                                               | 11                                                  |

    | `name`       | Name of the plan, providing a short description of the event the client will attend.                                                                 | Plan Name                                           |

    | `gallery`    | List of gallery resources (images / videos) attached to the plan. Opt-in: only returned when the search request includes `included_fields=gallery`; otherwise the field is omitted from the response. | _See `order.plan.gallery` documentation below_      |

    | `taxonomies` | List of taxonomies attached to the plan. Opt-in: only returned when the search request includes `included_fields=taxonomies`; otherwise the field is omitted from the response.      | _See `order.plan.taxonomies` documentation below_   |


    <details>

    <summary><span style="font-size:16pt;"><code>order.plan.gallery</code></span></summary>


    | Column Name | Description                                              | Example value                       |

    |-------------|----------------------------------------------------------|-------------------------------------|

