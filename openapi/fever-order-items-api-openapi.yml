      properties:
        order_ids:
          anyOf:
          - items:
              type: integer
            type: array
            maxItems: 1000
          - type: 'null'
          title: Order Ids
          description: List of ids of the orders to filter by.
          default: []
          examples:
          - []
          - - 123
          - - 123
            - 456
        plan_ids:
          anyOf:
          - items:
              type: integer
            type: array
            maxItems: 1000
          - type: 'null'
          title: Plan Ids
          description: List of ids of the plans to filter by.
          default: []
          examples:
          - []
          - - 123
          - - 123
            - 456
        date_field:
          anyOf:
          - type: string
            enum:
            - CREATED_DATE_UTC
            - UPDATED_DATE_UTC
            - EVENT_START_DATE_UTC
          - type: 'null'
          title: Date Field
          description: Date field to filter the search
          example: CREATED_DATE_UTC
        date_from:
          anyOf:
          - type: string
          - type: 'null'
          title: Date From
          description: Start date for the selected date field. If hour and minute are not specified, 00:00 is added by default
          example: 2024-12-18 00:00
        date_to:
          anyOf:
          - type: string
          - type: 'null'
          title: Date To
          description: End date for the selected date field. If hour and minute are not specified, 00:00 is added by default
          example: 2024-12-19 00:00
      additionalProperties: false
      type: object
      title: OrderItemParams
    B2BEndUser:
      properties:
        id:
          type: integer
          title: Id
          description: B2B End User ID
          example: 123456
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
          description: B2B End User email address
          example: test@feverup.com
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
          description: B2B End User first name
          example: John
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
          description: B2B End User last name
          example: Doe
      type: object
      required:
      - id
      title: B2BEndUser
    PaymentDetail:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
          description: Transaction ID issued by the payment processor (Braintree, Stripe, ...)
          example: tx_abc123
        card_brand:
          anyOf:
          - type: string
          - type: 'null'
          title: Card Brand
          description: Card brand (`visa`, `mastercard`, `amex`, `discover`, ...)
          example: visa
        payment_method:
          anyOf:
          - type: string
          - type: 'null'
          title: Payment Method
          description: Descriptive payment method joined from the order's payment configuration
          example: Card
      type: object
      title: PaymentDetail
    OrderItem-Output:
      properties:
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
          description: Unique ID of the order item
          example: 123456
        ticket_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ticket Id
          description: Operational identifier of the ticket grouping order items from the same session. Provided for compatibility with transactional use cases (e.g., reschedules and transfers); it is not intended as a core reporting metric.
          example: 334455
        booked_slot_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Booked Slot Id
          description: ID of the booked slot the order item was assigned to within its cart, when the activity behind the session uniquely resolves to a single booked slot (e.g. Escape This rooms). Matches `order.booked_slots[].id` for the same order. NULL when the activity exposes more than one asset and the cart engine spread parties across them; consumers can fall back to substring matching against `booked_slots[].asset.name`.
          example: 9876543
        cancellation_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Cancellation Date Utc
          description: Last UTC date when any part of the ticket was cancelled
          example: '2021-01-01 00:00:00'
        cancellation_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Cancellation Type
          description: 'Type of cancellation. REFUND: means that the ticket has been cancelled due to a refund. RESCHEDULE: means that the ticket has been cancelled due to a reschedule'
          example: REFUND
        created_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Created Date Utc
          description: UTC date of the ticket creation
          example: '2021-01-01 00:00:00'
        discount:
          anyOf:
          - type: number
          - type: 'null'
          title: Discount
          description: Discount applied to the ticket
          example: 10.0
        is_invite:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Invite
          description: Indicates whether the ticket is an invitation from the partner
          example: false
        modified_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Modified Date Utc
          description: UTC date of the last modification of the ticket
          example: '2021-01-01 00:00:00'
        purchase_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Purchase Date Utc
          description: UTC date of the ticket purchase
          example: '2021-01-01 00:00:00'
        event_start_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Start Date Utc
          description: UTC start date of the event associated with this order item
          example: '2021-01-01 00:00:00'
        validated_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Validated Date Utc
          description: UTC date when the order item was validated. This validation can be independent of the plan code (bar code), since some order items don't have a plan code but can be validated
          example: '2021-01-01 00:00:00'
        rating_comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Rating Comment
          description: Comment from the ticket user after attending the event
          example: Great experience!
        rating_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Rating Value
          description: Rating given by the ticket user after attending the event, ranging from 1 to 5
          example: 5.0
        surcharge:
          anyOf:
          - type: number
          - type: 'null'
          title: Surcharge
          description: Surcharge applied to the ticket
          example: 2.0
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
          description: 'If the ticket is active, transferred, or cancelled. ACTIVE: means that the ticket ID can be redeemed or it is redeemed. CANCELLED: means that the ticket ID can''t be redeemed since it has been cancelled. TRANSFERRED: means that the ticket ID can''t be used since it has been fully transferred to another user'
          example: ACTIVE
        unitary_price:
          anyOf:
          - type: number
          - type: 'null'
          title: Unitary Price
          description: Unitary price of the purchased ticket
          example: 50.0
        owner:
          anyOf:
          - $ref: '#/components/schemas/Owner'
          - type: 'null'
          description: Order item owner information
        pack:
          anyOf:
          - $ref: '#/components/schemas/Pack'
          - type: 'null'
          description: Pack information if the order item belongs to a pack
        plan_code:
          anyOf:
          - $ref: '#/components/schemas/PlanCode'
          - type: 'null'
          description: Plan code associated with the order item
        session:
          anyOf:
          - $ref: '#/components/schemas/Session'
          - type: 'null'
          description: Session information
        metadata:
          anyOf:
          - $ref: '#/components/schemas/Metadata'
          - type: 'null'
          description: Optional metadata supplied by the partner's integration when the order was placed, intended to support reconciliation against the partner's own system of record (external IDs for the order item and, when applicable, the subproduct it belongs to). Only returned when explicitly requested via `included_fields=metadata`; omitted by default to keep payloads compact for partners who don't need it. NULL when the partner did not provide any reporting metadata for the order item. See the `Metadata` schema for the full list of fields.
      type: object
      title: OrderItem
    Business:
      properties:
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
          description: Business ID
          example: 7c1caabf-85cd-42ac-96db-524b15443a7b
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Business name
          example: Sample City Tours
        tax_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tax Id
          description: Tax identification number of the business
          example: B12345678
      type: object
      title: Business
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /v1/auth/token
