          description: Surcharge applied to the ticket
          example: 2.0
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
          description: 'If the ticket is active, transferred, or cancelled. ACTIVE: means that the ticket ID can be redeemed or it is redeemed. CANCELLED: means that the ticket ID can''t be redeemed since it has been cancelled. TRANSFERRED: means that the ticket ID can''t be used since it has been fully transferred to another user'
          example: ACTIVE
        unitary_price:
          anyOf:
          - type: number
          - type: 'null'
          title: Unitary Price
          description: Unitary price of the purchased ticket
          example: 50.0
        owner:
          anyOf:
          - $ref: '#/components/schemas/Owner'
          - type: 'null'
          description: Order item owner information
        pack:
          anyOf:
          - $ref: '#/components/schemas/Pack'
          - type: 'null'
          description: Pack information if the order item belongs to a pack
        plan_code:
          anyOf:
          - $ref: '#/components/schemas/PlanCode'
          - type: 'null'
          description: Plan code associated with the order item
        session:
          anyOf:
          - $ref: '#/components/schemas/Session'
          - type: 'null'
          description: Session information
        metadata:
          anyOf:
          - $ref: '#/components/schemas/Metadata'
          - type: 'null'
          description: Optional metadata supplied by the partner's integration when the order was placed, intended to support reconciliation against the partner's own system of record (external IDs for the order item and, when applicable, the subproduct it belongs to). Only returned when explicitly requested via `included_fields=metadata`; omitted by default to keep payloads compact for partners who don't need it. NULL when the partner did not provide any reporting metadata for the order item. See the `Metadata` schema for the full list of fields.
      type: object
      title: OrderItem
    PlanCode:
      properties:
        id:
          type: integer
          title: Id
          description: Plan code ID
          example: 12345
        created_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Created Date Utc
          description: Plan code creation date
          example: '2023-12-18 08:30:27.789 Z'
        is_cancelled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Cancelled
          description: Plan code cancellation status
          example: false
        is_used:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Used
          description: Whether if the plan code has been used by a ticket or not
          deprecated: true
          example: false
        is_validated:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Validated
          description: Whether if the plan code has been validated or not
          example: false
        modified_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Modified Date Utc
          description: Plan code modification date
          example: '2023-12-18 08:30:27.789 Z'
        redeemed_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Redeemed Date Utc
          description: Plan code redemption date
          example: '2023-12-18 08:30:27.789 Z'
        cd_barcode:
          anyOf:
          - type: string
          - type: 'null'
          title: Cd Barcode
          description: Plan code barcode
          example: '1234567890123'
        applied_order_id_list:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Applied Order Id List
          description: List of order IDs for which the gift card was applied
          example:
          - 12345
      type: object
      required:
      - id
      title: PlanCode
    Pack:
      properties:
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
          description: Unique identifier of the order item pack
          example: 789012
        session_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Session Id
          description: Unique identifier of the pack session in the catalog (matches the id returned by the Sessions endpoint). Stable across all purchases of the same pack session. Use this instead of session_name, which is not unique.
          example: 284360344
        session_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Name
          description: Label of the session pack
          example: Family Package
      type: object
      title: Pack
    GalleryResourceType:
      type: string
      enum:
      - image
      - video
      title: GalleryResourceType
    Buyer:
      properties:
        id:
          type: integer
          title: Id
          description: Buyer ID
          example: '123456'
        date_of_birthday:
          anyOf:
          - type: string
          - type: 'null'
          title: Date Of Birthday
          description: Buyer date of birth
          example: '1990-01-01'
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
          description: Buyer email address
          example: test@example.com
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
          description: Buyer first name
          example: John
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
          description: Buyer language, extracted from the device locale. The format is ISO 639-1 (two letters).
          example: es
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
          description: Buyer last name
          example: Doe
        marketing_preference:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Marketing Preference
          description: Buyer marketing preference
          example: true
        b2b_end_user:
          anyOf:
          - $ref: '#/components/schemas/B2BEndUser'
          - type: 'null'
          description: B2B end user information
      type: object
      required:
      - id
      title: Buyer
    OrderItemParams:
      properties:
        order_ids:
          anyOf:
          - items:
              type: integer
            type: array
            maxItems: 1000
          - type: 'null'
          title: Order Ids
          description: List of ids of the orders to filter by.
          default: []
          examples:
          - []
          - - 123
          - - 123
            - 456
        plan_ids:
          anyOf:
          - items:
              type: integer
            type: array
            maxItems: 1000
          - type: 'null'
          title: Plan Ids
          description: List of ids of the plans to filter by.
          default: []
          examples:
          - []
          - - 123
          - - 123
            - 456
        date_field:
          anyOf:
          - type: string
            enum:
            - CREATED_DATE_UTC
            - UPDATED_DATE_UTC
            - EVENT_START_DATE_UTC
          - type: 'null'
          title: Date Field
          description: Date field to filter the search
          example: CREATED_DATE_UTC
        date_from:
          anyOf:
          - type: string
          - type: 'null'
          title: Date From
          description: Start date for the selected date field. If hour and minute are not specified, 00:00 is added by default
          example: 2024-12-18 00:00
        date_to:
          anyOf:
          - type: string
          - type: 'null'
          title: Date To
          description: End date for the selected date field. If hour and minute are not specified, 00:00 is added by default
          example: 2024-12-19 00:00
      additionalProperties: false
      type: object
      title: OrderItemParams
    PurchaseLocation:
      properties:
        id_geo_name:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id Geo Name
          description: ID of the geo name from where the purchase was made. This field is inferred so it might not be accurate. More information at https://www.geonames.org/about.html
          example: 123456
        city_name:
          anyOf:
          - type: string
          - type: 'null'
          title: City Name
          description: City from where the purchase was made. This field is inferred so it might not be accurate.
          example: Sunnyvale
        country_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Country Code
          description: Country code from where the purchase was made. This field is inferred so it might not be accurate.
          example: US
        region_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Region Code
          description: Region code from where the purchase was made. This field is inferred so it might not be accurate.
          example: CA
        postal_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Postal Code
          description: Postal code from where the purchase was made. This field is inferred so it might not be accurate.
          example: '94043'
        quality:
          anyOf:
          - $ref: '#/components/schemas/PurchaseLocationQuality'
          - type: 'null'
          description: Quality of the purchase location. Its value depends on the source it was inferred from.
          examples:
          - MEDIUM
          - HIGH
      type: object
      title: PurchaseLocation
    PartitionInfo:
      properties:
        partition_num:
          type: integer
          minimum: 0.0
          title: Partition Num
          description: Partition number
          example: 0
        endpoint:
          type: string
          title: Endpoint
          description: Endpoint to fetch data for partition
          example: /01b26479-0203-63c9-0000-d37572ae91ea?page=0
        size:
          type: integer
          minimum: 0.0
          title: Size
          description: Partition size in bytes
          example: 15058
        rows:
          type: integer
          minimum: 0.0
          title: Rows
          description: Number of rows contained in partition. One row represents a single transaction result (e.g. order, plan etc.).
          example: 4099
      type: object
      required:
      - partition_num
      - endpoint
      - size
      - rows
      title: PartitionInfo
      examples:
      - endpoint: /01b26479-0203-63c9-0000-d37572ae91ea?page=0
        partition_num: 0
        rows: 4099
        size: 15058
      - endpoint: /01b26479-0203-63c9-0000-d37572ae91ea?page=1
        partition_num: 1
        rows: 3145
        size: 11260
    Order-Input:
      properties:
        id:
          type: integer
          title: Id
          description: Unique order ID. This code groups all tickets bought in the same transaction.
          example: 123456
        parent_order_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Parent Order Id
          description: If the order comes from a reschedule, the original order ID.
          example: 11234
        buyer:
          anyOf:
          - $ref: '#/components/schemas/Buyer'
          - type: 'null'
          description: Order buyer information
        created_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Created Date Utc
          description: UTC date when the order was created
          example: '2021-01-01 00:00:00'
        updated_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated Date Utc
          description: UTC date when the order data was last updated. It moves whenever ANY field of the (flattened) order record changes — including nested/enrichment fields such as plan name, UTM or ratings — not only order-level fields. This is the field the `UPDATED_DATE_UTC` date filter matches against, so a search by `UPDATED_DATE_UTC` and this value are always consistent. For the order's own update time, use `order_updated_date_utc`.
          example: '2021-01-01 00:00:00'
        order_updated_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Order Updated Date Utc
          description: UTC date when the order itself was last updated (order-level fields only). Unlike `updated_date_utc`, it does not move when only nested/enrichment data (e.g. plan name) changes.
          example: '2021-01-01 00:00:00'
        surcharge:
          anyOf:
          - type: number
          - type: 'null'
          title: Surcharge
          description: Surcharge applied to the order
          example: 0.0
        currency:
          anyOf:
          - type: string
          - type: 'null'
          title: Currency
          description: ISO3 currency of the order monetary fields
          example: USD
        purchase_channel:
          anyOf:
          - type: string
          - type: 'null'
          title: Purchase Channel
          description: Purchase channel where the transaction comes from
          example: web
        channel:
          anyOf:
          - type: string
          - type: 'null'
          title: Channel
          description: Channel slug through which this order was placed (CD_ORDER_PURCHASE_SOURCE). Join key with the `channel` field in `POST /v1/reports/channels/search`. Null when no channel is recorded on the order.
          example: merlin-ticketmaster-uk
        payment_method:
          anyOf:
          - type: string
          - type: 'null'
          title: Payment Method
          description: Payment method used
          example: credit_card
        purchase_location_source:
          anyOf:
          - $ref: '#/components/schemas/PurchaseLocation'
          - type: 'null'
          description: Purchase location information
        billing_zip_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Billing Zip Code
          description: Billing ZIP Code manually fulfilled by the customer
          example: '28001'
        partner:
          anyOf:
          - $ref: '#/components/schemas/Partner'
          - type: 'null'
          description: Partner information
        plan:
          anyOf:
          - $ref: '#/components/schemas/Plan-Input'
          - type: 'null'
          description: Plan information
        coupon:
          anyOf:
          - $ref: '#/components/schemas/Coupon'
          - type: 'null'
          description: Coupon information
        assigned_seats:
          anyOf:
          - items:
              $ref: '#/components/schemas/AssignedSeat'
            type: array
          - type: 'null'
          title: Assigned Seats
          description: List of assigned seats for the order
        booking_questions:
          anyOf:
          - items:
              $ref: '#/components/schemas/BookingQuestion'
            type: array
          - type: 'null'
          title: Booking Questions
          description: List of booking questions and answers for the order
        business:
          anyOf:
          - $ref: '#/components/schemas/Business'
          - type: 'null'
          description: Business associated with the order
        utm:
          anyOf:
          - $ref: '#/components/schemas/UTM'
          - type: 'null'
          description: UTM attributed to the order
        order_items:
          anyOf:
          - items:
              $ref: '#/components/schemas/OrderItem-Input'
            type: array
          - type: 'null'
          title: Order Items
          description: List of order items associated with this order
        staff_notes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Staff Notes
          description: Staff notes associated with the order
        booked_slots:
          anyOf:
          - items:
              $ref: '#/components/schemas/BookedSlot'
            type: array
          - type: 'null'
          title: Booked Slots
          description: List of booked slots (assets/rooms reserved by the cart) associated with the order
        payment_details:
          anyOf:
          - items:
              $ref: '#/components/schemas/PaymentDetail'
            type: array
          - type: 'null'
          title: Payment Details
          description: Card payment details for the order. Empty/null when the order was not paid by card or no card details are recorded. Same array is denormalized across every order item belonging to the same order.
        order_group_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Order Group Id
          description: Groups orders from cluster tickets. All orders with the same order_group_id belong to the same purchase group (e.g., bundled tickets across multiple venues).
          example: 12345
        is_main_group_order:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Main Group Order
          description: Flag indicating whether this is the main order in a group. True for the primary order, False for secondary orders in the same group.
          example: true
      type: object
      required:
      - id
      title: Order
    Taxonomy:
      properties:
        id:
          type: integer
          title: Id
          description: Taxonomy ID
          example: 1234
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Taxonomy name
          example: Taxonomy name
      type: object
      required:
      - id
      title: Taxonomy
    OrderItemIncludedField:
      type: string
      enum:
      - booked_slots
      - staff_notes
      - metadata
      title: OrderItemIncludedField
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PurchaseLocationQuality:
      type: string
      enum:
      - HIGH
      - MEDIUM
      - UNKNOWN
      title: PurchaseLocationQuality
    Session:
      properties:
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
          description: Session ID
          example: 12345
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Session name
          example: Session name
        available_tickets:
          anyOf:
          - type: integer
          - type: 'null'
          title: Available Tickets
          description: Session available tickets. This field is always null if the session is a wait list.
          example: 10
        capacity:
          anyOf:
          - type: integer
          - type: 'null'
          title: Capacity
          description: Session capacity. This field is always null if the session is a wait list.
          example: 100
        end_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: End Date Utc
          description: Session end date
          example: '2023-12-18 08:30:27.789 Z'
        first_purchasable_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: First Purchasable Date Utc
          description: Session first purchasable date
          example: '2023-12-18'
        is_addon:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Addon
          description: Is the session an addon
          example: false
        is_shop_product:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Shop Product
          description: Is the session a shop product
          example: false
        is_wait_list:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Wait List
          description: Is the session a wait list. Deprecated, since now the waitlist flag is configured at plan level
          deprecated: true
          example: false
        start_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Date Utc
          description: Session start date
          example: '2023-12-18 08:30:27.789 Z'
        venue:
          anyOf:
          - $ref: '#/components/schemas/Venue'
          - type: 'null'
          description: Session venue
      type: object
      required:
      - id
      title: Session
    Partner:
      properties:
        id:
          type: integer
          title: Id
          description: Partner ID
          example: 1234
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Partner name
          example: Partner 1
      type: object
      required:
      - id
      title: Partner
    BookedSlotAsset:
      properties:
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
          description: Asset ID (e.g. an Escape This room)
          example: 3473
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Asset name
          example: NB - Asylum
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Asset description
        availability_strategy:
          anyOf:
          - type: string
          - type: 'null'
          title: Availability Strategy
          description: Capacity strategy used by the asset (BY_PARTY_COUNT or BY_PEOPLE_COUNT)
          example: BY_PARTY_COUNT
        max_party_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Party Size
          description: Maximum number of people allowed in a single party
          example: 4
        min_party_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min Party Size
          description: Minimum number of people required to book a party
          example: 1
        max_num_parties:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Num Parties
          description: Maximum number of independent parties the asset can host
          example: 1
        partner_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Partner Id
          description: Partner that owns the asset
          example: 190
        asset_type_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Asset Type Id
          description: Asset type ID
          example: 7
        is_manual_assignment_confirmation_required:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Manual Assignment Confirmation Required
          description: Whether the asset requires manual assignment confirmation
          example: false
      type: object
      title: BookedSlotAsset
    BookedSlot:
      properties:
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
          description: Unique ID of the booked slot. Matches `order_item.booked_slot_id` for every order item assigned to this slot.
          example: 9876543
        timeslot_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Timeslot Utc
          description: UTC start of the timeslot the slot is booked for
          example: '2026-05-08 09:30:00'
        slot_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Slot Count
          description: Capacity counter from the cart engine. Useful for debugging only — see `party_size` for the actual people booked.
          example: 12
        occupancy_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Occupancy Count
          description: Number of independent parties booked at the asset for this cart
          example: 1
        party_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Party Size
          description: Total people (count of order items) sold for this booked slot
          example: 4
        is_removed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Removed
          description: Whether the slot was removed by the cart engine
          example: false
        activity:
          anyOf:
          - $ref: '#/components/schemas/BookedSlotActivity'
          - type: 'null'
          description: Activity that owns the booked asset
        asset:
          anyOf:
          - $ref: '#/components/schemas/BookedSlotAsset'
          - type: 'null'
          description: Asset (e.g. room) the slot is booked on
      type: object
      title: BookedSlot
    Metadata:
      properties:
        external_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Id
          description: Partner-supplied external identifier for the order item, as sent by the partner's integration when the order was placed. Sourced from the order item's `METADATA.reporting.external_id` field on the upstream record. Useful when the partner needs to reconcile Fever order items against rows in their own system of record (e.g., box-office ticket IDs, internal SKUs). NULL when the partner did not provide one.
          example: CJ51001B
        external_subproduct_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Subproduct Id
          description: Partner-supplied external subproduct identifier for the order item, used when a single plan exposes multiple distinguishable subproducts (e.g., adult vs. child ticket variants, add-ons, seating categories). Sourced from the order item's `METADATA.reporting.external_subproduct_id` field on the upstream record. NULL when the partner did not provide one or the plan has no subproducts.
          example: ADULTO
      type: object
      title: Metadata
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /v1/auth/token
