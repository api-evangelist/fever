openapi: 3.2.0
info:
  title: Fever - Reporting Order Items API
  description: Access detailed event sales data through a reliable REST API.
  contact:
    name: Support
    email: data-support@feverup.com
  version: 1.5.0
  x-logo:
    url: https://res.cloudinary.com/fever/image/upload/ar_16:9,c_mpad,w_425/web/fever-logo-dark.jpg
servers:
- url: /v1
tags:
- name: Order Items
  description: These endpoints enable to access order-item data.
paths:
  /reports/order-items/search:
    post:
      tags:
      - Order Items
      summary: Request order items report
      description: Create a request to get a new order items report within the given time range.The search will be processed asynchronously, being able to fetch the result from the provided search ID
      operationId: search_order_items_reports_order_items_search_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user-id-to-impersonate
        in: header
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: User id from the user that you want to impersonate
          title: User-Id-To-Impersonate
        description: User id from the user that you want to impersonate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemParams'
      responses:
        '202':
          description: Request was created successfully but is still running asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchStatus'
        '408':
          description: Request Timeout
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      default: The request timed out. Please try again later
                      example: The request timed out. Please try again later
                      title: Detail
                      type: string
                  title: RequestTimeoutError
                  type: object
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      default: Server is busy. Please retry your query later
                      example: Server is busy. Please retry your query later
                      title: Detail
                      type: string
                  title: ServerBusyError
                  type: object
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      default: An internal server error occurred. Please try again later
                      example: An internal server error occurred. Please try again later
                      title: Detail
                      type: string
                  title: InternalServerError
                  type: object
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-codeSamples:
      - lang: bash
        source: "\ncurl -X POST \"https://<HOSTNAME>/v1/reports/order-items/search\" \\\n-H \"Content-Type: application/json\" \\\n-d '{\n    \"order_ids\": [\n        123,\n        456\n    ],\n    \"plan_ids\": [\n        123,\n        456\n    ],\n    \"date_field\": \"CREATED_DATE_UTC\",\n    \"date_from\": \"2024-12-18 00:00\",\n    \"date_to\": \"2024-12-19 00:00\"\n}' \\\n-H \"Authorization: Bearer <YOUR_ACCESS_TOKEN>\"\n            "
        label: curl
      - lang: python
        source: "\nimport requests\n\nhostname = \"<HOSTNAME>\"\nusername = \"<USERNAME>\"\npassword = \"<PASSWORD>\"\n\naccess_token = requests.post(f\"https://{hostname}/v1/auth/token\", data={\"username\": username, \"password\": password}).json()[\"access_token\"]\n\nrequests.post(f\"https://{hostname}/v1/reports/order-items/search\",\n    json={\n    \"order_ids\": [\n        123,\n        456\n    ],\n    \"plan_ids\": [\n        123,\n        456\n    ],\n    \"date_field\": \"CREATED_DATE_UTC\",\n    \"date_from\": \"2024-12-18 00:00\",\n    \"date_to\": \"2024-12-19 00:00\"\n},\n    headers={\"Authorization\": f\"Bearer {access_token}\"}\n)\n"
        label: Python
  /reports/order-items/search/{search_id}:
    get:
      tags:
      - Order Items
      summary: Get order items report
      description: Get an existing order items report from `search_id`, allowing to pass a specific `page` number. In case the search is still processing, it will return a `202` status code and you should retry it again until it is ready. Otherwise, it will return a `200` code and a sales report having list of order items. Notice that the `partition_info` metadata is only returned when `page=0`, being `null` for the rest of the pages
      operationId: get_order_items_search_page_reports_order_items_search__search_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: search_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Search Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Page
      - name: included_fields
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemIncludedField'
          description: Optional fields to include in the response
          title: Included Fields
        description: Optional fields to include in the response
      - name: user-id-to-impersonate
        in: header
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: User id from the user that you want to impersonate
          title: User-Id-To-Impersonate
        description: User id from the user that you want to impersonate
      responses:
        '200':
          description: Search was obtained successfully
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Search_Order_OrderItemParams_-Output'
                - $ref: '#/components/schemas/SearchStatus'
                title: Response Get Order Items Search Page Reports Order Items Search  Search Id  Get
                $ref: '#/components/schemas/Search_Order_OrderItemParams_-Input'
        '202':
          description: Request is still running asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchStatus'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      example: 'User test@example.com is not allowed to access the following fields: ''forbidden_field_1'', ''forbidden_field_2'''
                      title: Detail
                      type: string
                  required:
                  - detail
                  title: ForbiddenAccessToFieldError
                  type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      example: Search 01b571aa-0203-e36d-0000-0d3758abb35d not found.
                      title: Detail
                      type: string
                  required:
                  - detail
                  title: SearchIdNotFoundError
                  type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      example: Search ID 1234 is not valid
                      title: Detail
                      type: string
                  required:
                  - detail
                  title: InvalidSearchIdError
                  type: object
                - properties:
                    detail:
                      example: Invalid partition parameter. The partition must be long type parsable and between 0 and 1, but 2 is specified.
                      title: Detail
                      type: string
                  required:
                  - detail
                  title: InvalidPageIdError
                  type: object
                - properties:
                    detail:
                      example: Response is too large. Please apply filters to reduce its size.
                      title: Detail
                      type: string
                  required:
                  - detail
                  title: ResponseTooLargeError
                  type: object
        '408':
          description: Request Timeout
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      default: The request timed out. Please try again later
                      example: The request timed out. Please try again later
                      title: Detail
                      type: string
                  title: RequestTimeoutError
                  type: object
        '410':
          description: Search expired
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      default: Search expired. Please create a new one
                      example: Search expired. Please create a new one
                      title: Detail
                      type: string
                  title: SearchExpiredError
                  type: object
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      default: Server is busy. Please retry your query later
                      example: Server is busy. Please retry your query later
                      title: Detail
                      type: string
                  title: ServerBusyError
                  type: object
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                oneOf:
                - properties:
                    detail:
                      default: An internal server error occurred. Please try again later
                      example: An internal server error occurred. Please try again later
                      title: Detail
                      type: string
                  title: InternalServerError
                  type: object
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-codeSamples:
      - lang: bash
        source: '

          curl -X GET "https://<HOSTNAME>/v1/reports/order-items/search/<SEARCH_ID>?page=0" \

          -H "Authorization: Bearer <YOUR_ACCESS_TOKEN>"

          '
        label: curl
      - lang: python
        source: "\nimport requests\n\nhostname = \"<HOSTNAME>\"\nusername = \"<USERNAME>\"\npassword = \"<PASSWORD>\"\n\naccess_token = requests.post(f\"https://{hostname}/v1/auth/token\", data={\"username\": username, \"password\": password}).json()[\"access_token\"]\n\nrequests.get(f\"https://{hostname}/v1/reports/order-items/search/<SEARCH_ID>\",\n    params={'page': 0},\n    headers={\"Authorization\": f\"Bearer {access_token}\"}\n)\n"
        label: Python
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Metadata:
      properties:
        external_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Id
          description: Partner-supplied external identifier for the order item, as sent by the partner's integration when the order was placed. Sourced from the order item's `METADATA.reporting.external_id` field on the upstream record. Useful when the partner needs to reconcile Fever order items against rows in their own system of record (e.g., box-office ticket IDs, internal SKUs). NULL when the partner did not provide one.
          example: CJ51001B
        external_subproduct_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Subproduct Id
          description: Partner-supplied external subproduct identifier for the order item, used when a single plan exposes multiple distinguishable subproducts (e.g., adult vs. child ticket variants, add-ons, seating categories). Sourced from the order item's `METADATA.reporting.external_subproduct_id` field on the upstream record. NULL when the partner did not provide one or the plan has no subproducts.
          example: ADULTO
      type: object
      title: Metadata
    Taxonomy:
      properties:
        id:
          type: integer
          title: Id
          description: Taxonomy ID
          example: 1234
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Taxonomy name
          example: Taxonomy name
      type: object
      required:
      - id
      title: Taxonomy
    Search_Order_OrderItemParams_-Input:
      properties:
        partition_info:
          anyOf:
          - items:
              $ref: '#/components/schemas/PartitionInfo'
            type: array
          - type: 'null'
          title: Partition Info
          description: Partition information
        params:
          anyOf:
          - $ref: '#/components/schemas/OrderItemParams'
          - type: 'null'
          description: Parameters used in the search
        data:
          items:
            $ref: '#/components/schemas/Order-Input'
          type: array
          title: Data
          description: Data rows
      type: object
      required:
      - data
      title: Search[Order, OrderItemParams]
    PurchaseLocationQuality:
      type: string
      enum:
      - HIGH
      - MEDIUM
      - UNKNOWN
      title: PurchaseLocationQuality
    SearchStatus:
      properties:
        message:
          type: string
          title: Message
          description: Message about the search status
          example: Asynchronous execution in progress. Use provided query id to perform query monitoring and management.
        search_id:
          type: string
          format: uuid
          title: Search Id
          description: The search ID
          example: b59d4093-cbfc-4a1d-be5c-ba78d4ffbc64
      type: object
      required:
      - message
      - search_id
      title: SearchStatus
    Session:
      properties:
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
          description: Session ID
          example: 12345
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Session name
          example: Session name
        available_tickets:
          anyOf:
          - type: integer
          - type: 'null'
          title: Available Tickets
          description: Session available tickets. This field is always null if the session is a wait list.
          example: 10
        capacity:
          anyOf:
          - type: integer
          - type: 'null'
          title: Capacity
          description: Session capacity. This field is always null if the session is a wait list.
          example: 100
        end_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: End Date Utc
          description: Session end date
          example: '2023-12-18 08:30:27.789 Z'
        first_purchasable_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: First Purchasable Date Utc
          description: Session first purchasable date
          example: '2023-12-18'
        is_addon:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Addon
          description: Is the session an addon
          example: false
        is_shop_product:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Shop Product
          description: Is the session a shop product
          example: false
        is_wait_list:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Wait List
          description: Is the session a wait list. Deprecated, since now the waitlist flag is configured at plan level
          deprecated: true
          example: false
        start_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Date Utc
          description: Session start date
          example: '2023-12-18 08:30:27.789 Z'
        venue:
          anyOf:
          - $ref: '#/components/schemas/Venue'
          - type: 'null'
          description: Session venue
      type: object
      required:
      - id
      title: Session
    Venue:
      properties:
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
          description: Venue city
          example: New York
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
          description: Venue country
          example: USA
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Venue name
          example: Madison Square Garden
        timezone:
          anyOf:
          - type: string
          - type: 'null'
          title: Timezone
          description: Venue timezone
          example: America/New_York
      type: object
      title: Venue
    OrderItemIncludedField:
      type: string
      enum:
      - booked_slots
      - staff_notes
      - metadata
      title: OrderItemIncludedField
    Order-Output:
      properties:
        id:
          type: integer
          title: Id
          description: Unique order ID. This code groups all tickets bought in the same transaction.
          example: 123456
        parent_order_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Parent Order Id
          description: If the order comes from a reschedule, the original order ID.
          example: 11234
        buyer:
          anyOf:
          - $ref: '#/components/schemas/Buyer'
          - type: 'null'
          description: Order buyer information
        created_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Created Date Utc
          description: UTC date when the order was created
          example: '2021-01-01 00:00:00'
        updated_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated Date Utc
          description: UTC date when the order data was last updated. It moves whenever ANY field of the (flattened) order record changes — including nested/enrichment fields such as plan name, UTM or ratings — not only order-level fields. This is the field the `UPDATED_DATE_UTC` date filter matches against, so a search by `UPDATED_DATE_UTC` and this value are always consistent. For the order's own update time, use `order_updated_date_utc`.
          example: '2021-01-01 00:00:00'
        order_updated_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Order Updated Date Utc
          description: UTC date when the order itself was last updated (order-level fields only). Unlike `updated_date_utc`, it does not move when only nested/enrichment data (e.g. plan name) changes.
          example: '2021-01-01 00:00:00'
        surcharge:
          anyOf:
          - type: number
          - type: 'null'
          title: Surcharge
          description: Surcharge applied to the order
          example: 0.0
        currency:
          anyOf:
          - type: string
          - type: 'null'
          title: Currency
          description: ISO3 currency of the order monetary fields
          example: USD
        purchase_channel:
          anyOf:
          - type: string
          - type: 'null'
          title: Purchase Channel
          description: Purchase channel where the transaction comes from
          example: web
        channel:
          anyOf:
          - type: string
          - type: 'null'
          title: Channel
          description: Channel slug through which this order was placed (CD_ORDER_PURCHASE_SOURCE). Join key with the `channel` field in `POST /v1/reports/channels/search`. Null when no channel is recorded on the order.
          example: merlin-ticketmaster-uk
        payment_method:
          anyOf:
          - type: string
          - type: 'null'
          title: Payment Method
          description: Payment method used
          example: credit_card
        purchase_location_source:
          anyOf:
          - $ref: '#/components/schemas/PurchaseLocation'
          - type: 'null'
          description: Purchase location information
        billing_zip_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Billing Zip Code
          description: Billing ZIP Code manually fulfilled by the customer
          example: '28001'
        partner:
          anyOf:
          - $ref: '#/components/schemas/Partner'
          - type: 'null'
          description: Partner information
        plan:
          anyOf:
          - $ref: '#/components/schemas/Plan-Output'
          - type: 'null'
          description: Plan information
        coupon:
          anyOf:
          - $ref: '#/components/schemas/Coupon'
          - type: 'null'
          description: Coupon information
        assigned_seats:
          anyOf:
          - items:
              $ref: '#/components/schemas/AssignedSeat'
            type: array
          - type: 'null'
          title: Assigned Seats
          description: List of assigned seats for the order
        booking_questions:
          anyOf:
          - items:
              $ref: '#/components/schemas/BookingQuestion'
            type: array
          - type: 'null'
          title: Booking Questions
          description: List of booking questions and answers for the order
        business:
          anyOf:
          - $ref: '#/components/schemas/Business'
          - type: 'null'
          description: Business associated with the order
        utm:
          anyOf:
          - $ref: '#/components/schemas/UTM'
          - type: 'null'
          description: UTM attributed to the order
        order_items:
          anyOf:
          - items:
              $ref: '#/components/schemas/OrderItem-Output'
            type: array
          - type: 'null'
          title: Order Items
          description: List of order items associated with this order
        staff_notes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Staff Notes
          description: Staff notes associated with the order
        booked_slots:
          anyOf:
          - items:
              $ref: '#/components/schemas/BookedSlot'
            type: array
          - type: 'null'
          title: Booked Slots
          description: List of booked slots (assets/rooms reserved by the cart) associated with the order
        payment_details:
          anyOf:
          - items:
              $ref: '#/components/schemas/PaymentDetail'
            type: array
          - type: 'null'
          title: Payment Details
          description: Card payment details for the order. Empty/null when the order was not paid by card or no card details are recorded. Same array is denormalized across every order item belonging to the same order.
        order_group_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Order Group Id
          description: Groups orders from cluster tickets. All orders with the same order_group_id belong to the same purchase group (e.g., bundled tickets across multiple venues).
          example: 12345
        is_main_group_order:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Main Group Order
          description: Flag indicating whether this is the main order in a group. True for the primary order, False for secondary orders in the same group.
          example: true
      type: object
      required:
      - id
      title: Order
    GalleryResource:
      properties:
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
          description: Gallery resource URL
          example: https://www.example.com/image.jpg
        type:
          $ref: '#/components/schemas/GalleryResourceType'
          description: Gallery resource type (image or video)
          example: image
      type: object
      required:
      - type
      title: GalleryResource
    Buyer:
      properties:
        id:
          type: integer
          title: Id
          description: Buyer ID
          example: '123456'
        date_of_birthday:
          anyOf:
          - type: string
          - type: 'null'
          title: Date Of Birthday
          description: Buyer date of birth
          example: '1990-01-01'
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
          description: Buyer email address
          example: test@example.com
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
          description: Buyer first name
          example: John
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
          description: Buyer language, extracted from the device locale. The format is ISO 639-1 (two letters).
          example: es
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
          description: Buyer last name
          example: Doe
        marketing_preference:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Marketing Preference
          description: Buyer marketing preference
          example: true
        b2b_end_user:
          anyOf:
          - $ref: '#/components/schemas/B2BEndUser'
          - type: 'null'
          description: B2B end user information
      type: object
      required:
      - id
      title: Buyer
    AssignedSeat:
      properties:
        id:
          type: integer
          title: Id
          description: Booking question ID
          example: 123456
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Assigned seat name
          example: Level 2 - Row F - Seat 227
        seating_provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Seating Provider
          description: Seating provider
          example: seats-io
        seating_provider_seat_reference:
          anyOf:
          - type: string
          - type: 'null'
          title: Seating Provider Seat Reference
          description: Seating provider seat reference
          example: Level 2 - Row F - Seat 227
      type: object
      required:
      - id
      title: AssignedSeat
    PlanCode:
      properties:
        id:
          type: integer
          title: Id
          description: Plan code ID
          example: 12345
        created_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Created Date Utc
          description: Plan code creation date
          example: '2023-12-18 08:30:27.789 Z'
        is_cancelled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Cancelled
          description: Plan code cancellation status
          example: false
        is_used:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Used
          description: Whether if the plan code has been used by a ticket or not
          deprecated: true
          example: false
        is_validated:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Validated
          description: Whether if the plan code has been validated or not
          example: false
        modified_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Modified Date Utc
          description: Plan code modification date
          example: '2023-12-18 08:30:27.789 Z'
        redeemed_date_utc:
          anyOf:
          - type: string
          - type: 'null'
          title: Redeemed Date Utc
          description: Plan code redemption date
          example: '2023-12-18 08:30:27.789 Z'
        cd_barcode:
          anyOf:
          - type: string
          - type: 'null'
          title: Cd Barcode
          description: Plan code barcode
          example: '1234567890123'
        applied_order_id_list:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Applied Order Id List
          description: List of order IDs for which the gift card was applied
          example:
          - 12345
      type: object
      required:
      - id
      title: PlanCode
    Pack:
      properties:
        id:
          anyOf:
