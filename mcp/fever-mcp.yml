  token_endpoint: https://data-search.apigw.feverup.com/token
  registration_endpoint: https://data-search.apigw.feverup.com/register
  scopes_supported:
  - openid
  note: >-
    The MCP client opens a browser window to log in on first use via OAuth 2.0;
    subsequent requests are handled automatically.
client_config:
  claude_desktop:
    mcpServers:
      fever:
        url: https://data-search.apigw.feverup.com/mcp/
rate_limits: >-
  Rate limits apply to ensure fair usage. For higher limits contact
